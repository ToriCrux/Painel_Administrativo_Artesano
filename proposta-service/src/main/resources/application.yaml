auth:
  jwt:
    secret: ${AUTH_JWT_SECRET_BASE64:kKm5G2MIj9aMOK/y6v0tXpLHmv8nciqTmrLb+HlJk3k=}
    expiration: 28800

spring:
  application:
    name: PROPOSTA-SERVICE
  security:
    oauth2:
      resourceserver:
        jwt: {}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8084

eureka:
  instance:
    prefer-ip-address: true
    hostname: proposta-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

# ✅ NOVO (Config de criptografia / backfill)
app:
  crypto:
    aes-key-base64: ${APP_CRYPTO_AES_KEY_BASE64:}
    hmac-key-base64: ${APP_CRYPTO_HMAC_KEY_BASE64:}
    backfill:
      enabled: ${APP_CRYPTO_BACKFILL_ENABLED:false}
      null-legacy: ${APP_CRYPTO_BACKFILL_NULL_LEGACY:false}
