server:
  port: 8085

spring:
  application:
    name: pedido-service # Adicionado para melhor rastreabilidade no Eureka/Logs

  datasource:
    url: jdbc:postgresql://postgres-pedido:5432/pedido_db
    username: pedido_user
    password: pedido_pass
    # Não precisa de driver-class-name aqui, o Spring Boot detecta automaticamente

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/

services:
  catalogo:
    # CORREÇÃO CRÍTICA: Removida a porta (8082). Agora usa apenas o nome do serviço.
    base-url: http://catalogo-service

mensageria:
  queues:
    proposta-criada: proposta.criada.queue

auth:
  jwt:
    secret: ${JWT_SECRET_B64}