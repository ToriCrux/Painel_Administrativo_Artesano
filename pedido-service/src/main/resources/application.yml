server:
  port: 8085

spring:
  application:
    name: pedido-service # Adicionado para melhor rastreabilidade no Eureka/Logs

  datasource:
    url: jdbc:postgresql://postgres-pedido:5432/pedido_db
    username: pedido_user
    password: pedido_pass

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/

services:
  catalogo:
    base-url: http://catalogo-service

mensageria:
  queues:
    proposta-criada: proposta.criada.queue

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET_BASE64:kKm5G2MIj9aMOK/y6v0tXpLHmv8nciqTmrLb+HlJk3k=}
    expiration: 28800
  service:
    token: ${AUTH_SERVICE_TOKEN:}

