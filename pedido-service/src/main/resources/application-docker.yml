server:
  port: 8085

spring:
  application:
    name: pedido-service

  datasource:
    url: jdbc:postgresql://localhost:5433/pedido_db
    username: pedido_user
    password: pedido_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

services:
  catalogo:
    base-url: http://CATALOGO-SERVICE

mensageria:
  queues:
    proposta-criada: proposta.criada.queue

auth:
  jwt:
    secret: ${JWT_SECRET_B64}