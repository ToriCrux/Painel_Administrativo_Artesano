spring:
  application:
    name: AUTENTICACAO-SERVICE
  profiles:
    active: dev

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET_BASE64:kKm5G2MIj9aMOK/y6v0tXpLHmv8nciqTmrLb+HlJk3k=}
    expiration: 28800

eureka:
  instance:
    prefer-ip-address: true
    hostname: autenticacao-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://registry:8761/eureka/

server:
  port: 8081
